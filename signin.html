<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="phone-gate.js"></script>
  <script src="cart-id.js?v=2"></script>
</head>

<body class="signin">
  <div class="container">
    <!-- Fullscreen centered auth layout (no left/right sections) -->
    <div class="auth-wrapper" role="main">
      <div class="signin-center" id="signin-center">
        <button type="button" id="signin-pill-email" class="signup-pill signup-pill--right" hidden
          aria-label="Tap to edit."></button>
        <div class="auth-card" aria-labelledby="signin-title">
        <h1 id="signin-title" class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to continue. New here? You can sign up using the Sign in with App button.</p>

        <!-- Phone sign-in option at top; becomes "Sign in with email" while QR is open -->
        <div style="text-align: center; margin-bottom: 12px;">
          <button type="button" id="qr-signin-btn-top" class="auth-button qr-app-btn">
            Sign in with App
          </button>
        </div>

        <!-- div (not form) reduces Mac/Chrome login autofill heuristics; fields keep normal .auth-input sizing -->
        <div id="signin-form" class="auth-form" role="group" aria-label="Sign in"
          data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other">
          <div class="nc-autofill-trap" aria-hidden="true">
            <input type="text" name="username" autocomplete="username" tabindex="-1" value="" />
            <input type="password" name="password" autocomplete="current-password" tabindex="-1" value="" />
          </div>

          <div class="auth-field email-field">
            <label class="auth-label" for="email">Email or phone number</label>
            <input id="email" class="auth-input" type="text" name="nc_kiosk_id"
              placeholder="Email or phone" autocomplete="off" required
              data-field="email" inputmode="text" autocapitalize="none"
              autocorrect="off" spellcheck="false" enterkeyhint="next"
              data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other" />
          </div>

          <div class="auth-field password-field" id="password-section">
            <label class="auth-label" for="password">Password</label>
            <div class="auth-input-wrap">
              <input id="password" class="auth-input" type="password" name="nc_kiosk_secret"
                placeholder="••••••••" autocomplete="new-password" required
                data-field="password" enterkeyhint="go"
                data-lpignore="true" data-1p-ignore="true" data-bwignore="true" data-form-type="other" />
              <button type="button" id="toggle-password" class="password-toggle"
                aria-label="Show password">Show</button>
            </div>
          </div>

          <button type="button" id="signin-submit" class="auth-button">Sign In</button>
          <div id="auth-error" class="auth-error" style="display:none;"></div>
          <div class="auth-links" aria-label="Helpful links">
            <a href="create-account.html" id="create-link">Create account</a>
          </div>
        </div>

        <style>
          .nc-autofill-trap {
            position: absolute !important;
            left: -10000px !important;
            width: 1px !important;
            height: 1px !important;
            overflow: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
          }
        </style>
        <script>
          (function () {
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const toggle = document.getElementById('toggle-password');
            if (!email || !password) return;

            toggle?.addEventListener('click', function () {
              if (password.type === 'password') {
                password.type = 'text';
                this.textContent = 'Hide';
                this.setAttribute('aria-label', 'Hide password');
              } else {
                password.type = 'password';
                this.textContent = 'Show';
                this.setAttribute('aria-label', 'Show password');
              }
              try { password.focus({ preventScroll: true }); } catch (_) {}
            });

            // Clear any late autofill without changing field layout/behavior.
            let userTyped = false;
            const mark = function () { userTyped = true; };
            email.addEventListener('input', mark);
            password.addEventListener('input', mark);
            email.addEventListener('keydown', mark);
            password.addEventListener('keydown', mark);

            function scrub() {
              if (userTyped) return;
              if (document.activeElement !== email && email.value) email.value = '';
              if (document.activeElement !== password && password.value) password.value = '';
              document.querySelectorAll('.nc-autofill-trap input').forEach(function (el) {
                try { el.value = ''; } catch (_) {}
              });
            }
            scrub();
            let n = 0;
            const iv = setInterval(function () {
              scrub();
              if (++n > 20) clearInterval(iv);
            }, 150);
          })();
        </script>

        <!-- App QR Sign-in Panel (shown instead of form when user taps "Sign in with App") -->
        <div id="qr-app-panel" style="display:none; text-align:center; padding:4px 0;">
          <div id="qr-app-canvas">
            <div class="qr-app-placeholder" aria-hidden="true"></div>
          </div>
          <p class="qr-app-copy" style="font-size:13px; color:#555; margin:0 0 10px 0;">Open NobelCart app and scan to sign in</p>
          <div id="qr-app-status" class="qr-app-copy" style="font-size:13px; color:#888; display:flex; align-items:center; justify-content:center; gap:8px; min-height:20px;">
            <span id="qr-app-dot" style="width:8px;height:8px;border-radius:50%;background:#1b7991;display:inline-block;animation:qrPulse 1.4s ease-in-out infinite;"></span>
            <span id="qr-app-msg">Waiting for scan…</span>
          </div>
          <p id="qr-app-ttl" class="qr-app-copy" style="font-size:12px; color:#888; margin:8px 0 0 0;">This QR changes every 5 minutes</p>
        </div>
        <style>@keyframes qrPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.8);}}</style>

        <!-- OTP Verification Overlay (for unfinished phone verification) -->
        <div id="otp-overlay" class="otp-overlay" style="display: none;">
          <div class="otp-card">
            <h2>Verify email</h2>
            <p id="otp-hint">Enter the 6-digit code we sent to your email.</p>
            <input type="text" id="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="done" />
            <button type="button" id="otp-verify-btn" class="auth-button">Verify Code</button>
            <button type="button" id="otp-resend-btn" class="text-button">Resend code</button>
            <button type="button" id="otp-cancel-btn" class="text-button">Cancel</button>
            <div id="otp-error" class="auth-error" style="display:none;"></div>
          </div>
        </div>
        </div><!-- /.auth-card -->
      </div><!-- /.signin-center -->
    </div><!-- /.auth-wrapper -->
  </div><!-- /.container -->

  <style>
    .signin-center {
      position: relative;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      overflow: visible;
      margin: 0 auto;
    }
    body.signin .signin-center .auth-card {
      width: 100%;
      max-width: 440px;
    }

    /* Same completed-step pills as create-account */
    body.signin .signup-pill {
      position: absolute;
      z-index: 3;
      width: max-content;
      max-width: none;
      min-height: 52px;
      padding: 10px 10px 10px 12px;
      border: 1px solid rgba(74, 90, 78, 0.22);
      border-radius: 16px;
      background: #ffffff;
      color: #3a372f;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.2;
      text-align: left;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        background-color 160ms ease,
        color 160ms ease,
        transform 280ms ease,
        opacity 280ms ease,
        box-shadow 160ms ease,
        visibility 280ms ease;
      -webkit-tap-highlight-color: transparent;
      top: 50%;
      margin: 0;
      box-shadow: 0 2px 10px rgba(45, 42, 38, 0.06);
    }
    body.signin .signup-pill.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    body.signin .signup-pill[hidden] { display: none !important; }
    body.signin .signup-pill:active,
    body.signin .signup-pill:focus {
      outline: none;
      background: #f3f5f3;
      color: #2d2a26;
      box-shadow: 0 3px 12px rgba(74, 90, 78, 0.1);
    }
    body.signin .signup-pill--right {
      left: calc(100% + 16px);
      right: auto;
      bottom: auto;
      transform: translateY(calc(-50% + 40px)) scale(0.96);
    }
    body.signin .signup-pill--right.is-visible {
      transform: translateY(calc(-50% + 40px)) scale(1);
    }
    body.signin .signup-pill .pill-check {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #5a6b5e;
      color: #f4f5f3;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    body.signin .signup-pill .pill-copy {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      white-space: nowrap;
    }
    body.signin .signup-pill .pill-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #2d2a26;
      white-space: nowrap;
      line-height: 1.2;
    }
    body.signin .signup-pill .pill-hint {
      font-size: 10px;
      font-weight: 600;
      color: #8b7355;
      white-space: nowrap;
      line-height: 1.15;
    }
    body.signin.keyboard-visible .signup-pill {
      min-height: 48px;
      padding: 8px 8px 8px 10px;
    }
    body.signin.keyboard-visible .signup-pill--right {
      left: calc(100% + 18px);
      transform: translateY(calc(-50% + 48px)) scale(0.96);
    }
    body.signin.keyboard-visible .signup-pill--right.is-visible {
      transform: translateY(calc(-50% + 48px)) scale(1);
    }
    @media (max-width: 720px) {
      body.signin .signup-pill--right {
        left: calc(100% + 12px);
        transform: translateY(calc(-50% + 32px)) scale(0.96);
      }
      body.signin .signup-pill--right.is-visible {
        transform: translateY(calc(-50% + 32px)) scale(1);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      body.signin .signup-pill { transition: none; }
    }

    @keyframes shine {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    .shine-button {
      background-image: linear-gradient(90deg,
          #1f648d 0%,
          rgba(243, 243, 243, 0.791) 50%,
          #268aab 100%);
      background-size: 200% 100%;
      animation: shine 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .shine-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent,
          rgba(97, 203, 244, 0.4),
          transparent);
      animation: shine 3s ease-in-out infinite;
    }

    .qr-app-btn {
      margin-top: 0;
      background-color: #1b7991;
      background-image: none;
      color: #f2f2f2;
      animation: none;
      border: 1px solid transparent;
      transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease,
        opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .qr-app-btn.is-hidden-btn {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: none;
    }

    .qr-app-btn:hover {
      background-color: #17667b;
      background-image: none;
    }

    .qr-app-btn.is-email-back {
      background-color: #fff;
      background-image: none;
      color: #1a1a1a;
      border: 1px solid rgba(0, 0, 0, 0.14);
    }

    .qr-app-btn.is-email-back:hover {
      background-color: #f4f4f4;
    }

    body.signin .auth-card {
      position: relative;
    }

    #signin-form .auth-field,
    #signin-form .auth-button,
    #signin-form .auth-links,
    #signin-form .auth-error {
      transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #signin-form.is-await-fields .auth-field,
    #signin-form.is-await-fields .auth-button,
    #signin-form.is-await-fields .auth-links,
    #signin-form.is-await-fields .auth-error {
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
    }

    #signin-form:not(.is-await-fields) .password-field {
      transition-delay: 0.08s;
    }

    #signin-form:not(.is-await-fields) .auth-button {
      transition-delay: 0.14s;
    }

    #signin-form:not(.is-await-fields) .auth-links {
      transition-delay: 0.18s;
    }

    #qr-app-panel {
      transition: opacity 0.38s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #qr-app-panel.is-out {
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      pointer-events: none;
    }

    #qr-app-canvas {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      min-height: 292px;
    }

    .qr-app-placeholder {
      position: absolute;
      width: 292px;
      height: 292px;
      border-radius: 12px;
      background: #ececea;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #qr-app-canvas.is-waiting .qr-app-placeholder {
      opacity: 1;
      transform: scale(1);
      animation: qrPhPulse 1.6s ease-in-out infinite;
    }

    #qr-app-canvas.is-ready .qr-app-placeholder {
      opacity: 0;
      transform: scale(1);
      animation: none;
    }

    @keyframes qrPhPulse {
      0%, 100% { background-color: #e6e6e4; }
      50% { background-color: #f3f3f1; }
    }

    .qr-app-frame {
      position: relative;
      z-index: 1;
      background: #f3f3f3;
      padding: 16px;
      display: inline-block;
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.94) translateY(10px);
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .qr-app-frame.is-in {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .qr-app-frame img {
      display: block;
    }

    .qr-app-copy {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease 0.12s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.12s;
    }

    #qr-app-panel.is-waiting .qr-app-copy,
    #qr-app-panel.is-ready .qr-app-copy {
      opacity: 1;
      transform: translateY(0);
    }

    .phone-guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.64);
      z-index: 10050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 24px;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .phone-guide-overlay[hidden] {
      display: none !important;
    }

    .phone-guide-overlay.is-open {
      opacity: 1;
    }

    .phone-guide-overlay.is-leaving {
      opacity: 0;
      transition-delay: 0.12s;
      transition-duration: 0.45s;
    }

    .phone-guide-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .phone-guide-overlay.is-open .phone-guide-card {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.1s;
    }

    .phone-guide-overlay.is-leaving .phone-guide-card {
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition-delay: 0s;
      transition-duration: 0.35s;
    }

    .phone-guide-title {
      margin: 0;
      color: #f4f4f5;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-align: center;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    /* 1260×2552 source, framed like a phone over the QR panel */
    .phone-guide-device {
      height: min(60vh, 560px);
      aspect-ratio: 1260 / 2552;
      border-radius: 22px;
      overflow: hidden;
      background: #0b0b0d;
      box-shadow:
        0 0 0 2px #1c1c1e,
        0 0 0 4px #3a3a3c,
        0 18px 44px rgba(0, 0, 0, 0.42);
    }

    .phone-guide-device video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
      pointer-events: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .phone-guide-device.is-in video {
      opacity: 1;
      transition-delay: 0s;
    }

    .phone-guide-device.is-in.is-intro video {
      transition-delay: 0.4s;
    }

    .phone-guide-device.is-out video,
    .phone-guide-device.is-in.is-loop-out video {
      opacity: 0;
      transition-delay: 0s;
      transition-duration: 0.4s;
    }

    .phone-guide-device.is-out video {
      transition-delay: 0.2s;
      transition-duration: 0.5s;
    }

    .phone-guide-got-it {
      appearance: none;
      border: none;
      background: #fff;
      color: #1a1a1a;

        min-height: 40px;
      }
    }

    /* OTP Overlay Styles */
    .otp-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;

    }

    .otp-card {
      background: #f3f3f3;
      padding: 30px;

      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .otp-card h2 {
      margin-top: 0;
      color: #333;
    }

    .otp-card p {

    #otp-input {

      cursor: pointer;

  </style>

  <style>
    /* Splash Screen Styles */
    #splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 1.5s ease-out;
    }

    #splash-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: splashFade 9s ease-in-out forwards;
    }

    @keyframes splashFade {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }

      15% {
        opacity: 1;
        transform: scale(1);
      }

      85% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.05);
      }
    }
  </style>

  <!-- Splash Screen Markup -->
  <div id="splash-overlay" style="display: none;">
    <img id="splash-logo" src="noble.png" alt="Noble Cart">
  </div>

  <!-- Phone sign-in guide: loops over the QR panel until Got it. -->
  <div id="phone-signin-guide" class="phone-guide-overlay" hidden role="dialog"
    aria-modal="true" aria-labelledby="phone-signin-guide-title">
    <div class="phone-guide-card">
      <p id="phone-signin-guide-title" class="phone-guide-title">Scan with the NobelCart app</p>
      <div class="phone-guide-device">
        <video id="phone-signin-guide-video" src="Images/Guide-signin-phone.mp4"
          muted playsinline preload="auto" aria-hidden="true"></video>
      </div>
      <button type="button" id="phone-signin-guide-got-it" class="phone-guide-got-it">Got it</button>
    </div>
  </div>

  <!-- Splash Logic -->
  <script>
    (function () {
      // Skip splash if this is an admin redirect
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin')) return;

      // Check if splash has already been shown in this session
      const hasShown = sessionStorage.getItem('nc_splash_shown');
      if (!hasShown) {
        const splash = document.getElementById('splash-overlay');
        if (splash) {
          splash.style.display = 'flex';
          // Mark as shown immediately so reload/navigation skips it
          sessionStorage.setItem('nc_splash_shown', 'true');

          // Remove splash after animation completes (9s + slight buffer)
          setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => {
              splash.remove();
            }, 1500); // Wait for opacity transition
          }, 9000);
        }
      }
    })();
  </script>

  <script src="qrcode.min.js"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="error-reporter.js"></script>
  <script src="vk-auth.js?v=12"></script>
  <script src="policy-gate.js"></script>
  <script>
    // Clear stale/invalid local session to avoid 400 token errors and prevent watcher loops
    (async () => {
      try {
        if (!window.sb) return;
        // Always force sign-out on the sign-in page to ensure no sticky sessions
        // This prevents the site.js watcher from triggering a "force_sign_out" loop
        await window.sb.auth.signOut({ scope: 'local' });

        // Clear storage but preserve splash + pending signup email prefill
        const splash = sessionStorage.getItem('nc_splash_shown');
        const signupEmail = sessionStorage.getItem('nc_signup_email');
        try { localStorage.removeItem('nc_cart_v1'); } catch { }
        try { sessionStorage.clear(); } catch { }
        if (splash) sessionStorage.setItem('nc_splash_shown', splash);
        if (signupEmail) sessionStorage.setItem('nc_signup_email', signupEmail);
        try {
          const ls = localStorage.getItem('nc_signup_email');
          if (ls) sessionStorage.setItem('nc_signup_email', ls);
        } catch { }

      } catch { }
    })();
  </script>
  <script>
    // Elevate auth card when focusing inputs and spotlight focused field
    (function () {
      const body = document.body;
      const inputs = Array.from(document.querySelectorAll('#signin-form .auth-input'));
      if (!inputs.length) return;

      const focusClasses = ['focus-email', 'focus-password'];
      const setFocusState = (field) => {
        body.classList.remove(...focusClasses);
        if (field === 'email' || field === 'password') {
          body.classList.add(`focus-${field}`);
        }
      };

      const handleBlur = () => {
        setTimeout(() => {
          const active = document.activeElement;
          const next = inputs.find((input) => input === active);
          if (next) {
            setFocusState(next.dataset.field);
            body.classList.add('keyboard-visible');
          } else if (window.__vkActive) {
            body.classList.add('keyboard-visible');
          } else {
            body.classList.remove('keyboard-visible', ...focusClasses);
          }
        }, 140);
      };

      inputs.forEach((input) => {
        input.addEventListener('focus', () => {
          body.classList.add('keyboard-visible');
          setFocusState(input.dataset.field);
        });
        input.addEventListener('blur', handleBlur);
      });
    })();
  </script>
  <script>
    // Minimal full-screen loading overlay (supports centered logo)
    function showLoadingOverlay(message, opts) {
      const options = opts || {};
      try {
        let ov = document.getElementById('nc-loading-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'nc-loading-overlay';
          ov.setAttribute('aria-live', 'polite');
          ov.setAttribute('role', 'status');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(2px);';
          const inner = document.createElement('div');
          inner.className = 'nc-loading-inner';
          inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:14px;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#fff;padding:24px;';
          if (options.logo) {
            const img = document.createElement('img');
            img.src = 'Images/logo.gif';
            img.alt = 'Loading';
            img.className = 'nc-loading-logo';
            img.style.cssText = 'max-width:72%;max-height:42vh;height:auto;width:auto;display:block;';
            inner.appendChild(img);
          } else {
            const spinner = document.createElement('div');
            spinner.className = 'nc-loading-spinner';
            spinner.style.cssText = 'width:36px;height:36px;border:3px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation: ncspin 0.9s linear infinite;';
            inner.appendChild(spinner);
          }
          const text = document.createElement('div');
          text.className = 'nc-loading-text';
          text.style.cssText = 'font-size:16px;font-weight:600;letter-spacing:0.01em;';
          text.textContent = message || (options.logo ? '' : 'Loading…');
          if (text.textContent) inner.appendChild(text);
          ov.appendChild(inner);
          if (!document.getElementById('nc-loading-style')) {
            const style = document.createElement('style');
            style.id = 'nc-loading-style';
            style.textContent = '@keyframes ncspin{to{transform:rotate(360deg)}}';
            document.head.appendChild(style);
          }
          document.body.appendChild(ov);
        } else {
          const t = ov.querySelector('.nc-loading-text');
          if (t) {
            t.textContent = message || 'Loading…';
            t.style.display = (message || !options.logo) ? '' : 'none';
          } else if (message) {
            const text = document.createElement('div');
            text.className = 'nc-loading-text';
            text.style.cssText = 'font-size:16px;font-weight:600;letter-spacing:0.01em;';
            text.textContent = message;
            ov.firstElementChild?.appendChild(text);
          }
          const inner = ov.firstElementChild; if (inner) inner.style.color = '#fff';
          ov.style.display = 'flex';
        }
        return ov;
      } catch (_) { }
    }

    function hideLoadingOverlay() {
      try {
        const ov = document.getElementById('nc-loading-overlay');
        if (ov) ov.style.display = 'none';
      } catch (_) { }
    }

    function setSigninBusy(busy) {
      const btn = document.getElementById('signin-submit');
      if (btn) {
        btn.disabled = !!busy;
        btn.textContent = busy ? 'Signing in…' : 'Sign In';
        btn.style.opacity = busy ? '0.75' : '';
      }
      if (inputEl) inputEl.disabled = !!busy;
      if (passwordEl) passwordEl.disabled = !!busy;
    }

    // --- Sign-in Logic (Email OR Phone) ---
    const form = document.getElementById('signin-form');
    const inputEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const passwordSection = document.getElementById('password-section');
    const err = document.getElementById('auth-error');
    const emailPill = document.getElementById('signin-pill-email');

    /** Letters/words → email. 4+ digits (no letters) → phone (+1 US). */
    function detectIdKind(raw) {
      const val = String(raw || '').trim();
      if (!val) return 'id';
      if (/[a-zA-Z]/.test(val)) return 'email';
      const digits = val.replace(/\D/g, '');
      if (digits.length >= 4) return 'phone';
      return 'id';
    }

    function pillLabelForKind(kind) {
      if (kind === 'email') return 'Email';
      if (kind === 'phone') return 'Phone number';
      return 'Email or phone';
    }

    /** Match server normalizeUsPhone → E.164 +1XXXXXXXXXX */
    function normalizeUsPhone(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      let ten = null;
      if (digits.length === 10) ten = digits;
      else if (digits.length === 11 && digits.startsWith('1')) ten = digits.slice(1);
      else return null;
      if (!/^[2-9]\d{2}[2-9]\d{6}$/.test(ten)) return null;
      return '+1' + ten;
    }

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());
    }

    function formatUsPhoneDisplay(raw) {
      let d = String(raw || '').replace(/\D/g, '');
      if (d.length >= 11 && d[0] === '1') d = d.slice(1);
      d = d.slice(0, 10);
      if (!d.length) return '+1 ';
      if (d.length < 4) return '+1 (' + d;
      if (d.length < 7) return '+1 (' + d.slice(0, 3) + ') ' + d.slice(3);
      return '+1 (' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
    }

    function validateIdentifier(raw) {
      const val = String(raw || '').trim();
      if (!val) return 'Please enter your email or phone number.';
      const kind = detectIdKind(val);
      if (kind === 'email') {
        if (!isValidEmail(val)) return 'Enter a valid email.';
        return null;
      }
      if (kind === 'phone') {
        if (!normalizeUsPhone(val)) return 'Enter a valid US phone number (+1).';
        return null;
      }
      return 'Enter a valid email or US phone number.';
    }

    function showIdError(msg) {
      if (!err) return;
      err.textContent = msg || '';
      err.style.display = msg ? 'block' : 'none';
    }

    function normalizedIdentifierForSubmit(raw) {
      const val = String(raw || '').trim();
      if (detectIdKind(val) === 'phone') return normalizeUsPhone(val) || val;
      return val;
    }

    function fillEmailPill() {
      if (!emailPill) return;
      const kind = detectIdKind(inputEl?.value);
      const label = pillLabelForKind(kind);
      emailPill.dataset.stepIndex = kind;
      emailPill.innerHTML =
        '<span class="pill-copy">' +
          '<span class="pill-label">' + label + '</span>' +
          '<span class="pill-hint">Tap to edit</span>' +
        '</span>' +
        '<span class="pill-check" aria-hidden="true">✓</span>';
      emailPill.setAttribute('aria-label', label + '. Tap to edit.');
    }

    let pillAnimGen = 0;
    function updateSigninEmailPill() {
      if (!emailPill || !inputEl) return;
      const qrOpen = (() => {
        const p = document.getElementById('qr-app-panel');
        return p && p.style.display === 'block' && !p.classList.contains('is-out');
      })();
      const otpOpen = document.body.classList.contains('otp-open') ||
        (document.getElementById('otp-overlay')?.style.display === 'flex');
      const onPassword = document.body.classList.contains('focus-password');
      const hasEmail = !!(inputEl.value || '').trim();
      const show = onPassword && hasEmail && !qrOpen && !otpOpen;
      const kind = detectIdKind(inputEl.value);
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isShown = !emailPill.hidden && emailPill.classList.contains('is-visible');
      const gen = ++pillAnimGen;

      if (!show) {
        if (!isShown && emailPill.hidden) return;
        if (reduceMotion || !isShown) {
          emailPill.classList.remove('is-visible');
          emailPill.hidden = true;
          emailPill.dataset.stepIndex = '';
          emailPill.textContent = '';
          return;
        }
        emailPill.classList.remove('is-visible');
        let done = false;
        const finish = () => {
          if (done || pillAnimGen !== gen) return;
          done = true;
          emailPill.removeEventListener('transitionend', onEnd);
          emailPill.hidden = true;
          emailPill.dataset.stepIndex = '';
          emailPill.textContent = '';
        };
        const onEnd = (e) => {
          if (e.target !== emailPill || e.propertyName !== 'opacity') return;
          finish();
        };
        emailPill.addEventListener('transitionend', onEnd);
        setTimeout(finish, 320);
        return;
      }

      if (isShown && emailPill.dataset.stepIndex === kind) {
        fillEmailPill();
        return;
      }

      fillEmailPill();
      emailPill.hidden = false;
      if (reduceMotion) {
        emailPill.classList.add('is-visible');
        return;
      }
      emailPill.classList.remove('is-visible');
      void emailPill.offsetWidth;
      requestAnimationFrame(() => {
        if (pillAnimGen !== gen) return;
        emailPill.classList.add('is-visible');
      });
    }

    emailPill?.addEventListener('click', () => {
      try { inputEl.focus({ preventScroll: true }); } catch (_) {
        try { inputEl.focus(); } catch (__) {}
      }
      updateSigninEmailPill();
    });

    // Live +1 phone formatting once 4 digits (no letters)
    inputEl?.addEventListener('input', () => {
      const kind = detectIdKind(inputEl.value);
      if (kind === 'phone') {
        const formatted = formatUsPhoneDisplay(inputEl.value);
        if (inputEl.value !== formatted) {
          inputEl.value = formatted;
          try { inputEl.setSelectionRange(formatted.length, formatted.length); } catch (_) {}
        }
      }
      updateSigninEmailPill();
    });

    // Keep pill in sync with focus / typing / VK Done
    [inputEl, passwordEl].forEach((el) => {
      el?.addEventListener('focus', () => setTimeout(updateSigninEmailPill, 40));
      el?.addEventListener('blur', () => setTimeout(updateSigninEmailPill, 160));
      el?.addEventListener('vk:done', () => setTimeout(updateSigninEmailPill, 80));
    });
    passwordEl?.addEventListener('input', updateSigninEmailPill);
    new MutationObserver(updateSigninEmailPill).observe(document.body, {
      attributes: true,
      attributeFilter: ['class'],
    });
    updateSigninEmailPill();
    window.ncUpdateSigninPill = updateSigninEmailPill;

    /** Returns true if advance should stop (invalid). */
    function gateEmailAdvance(current) {
      if (!current || current !== inputEl) return false;
      const msg = validateIdentifier(inputEl.value);
      if (msg) {
        showIdError(msg);
        try { inputEl.focus({ preventScroll: true }); } catch (_) {
          try { inputEl.focus(); } catch (__) {}
        }
        return true;
      }
      showIdError('');
      if (detectIdKind(inputEl.value) === 'phone') {
        const e164 = normalizeUsPhone(inputEl.value);
        if (e164) inputEl.value = formatUsPhoneDisplay(e164);
      }
      return false;
    }

    window.ncSigninGate = {
      handleVkDone(current) {
        if (!document.body.classList.contains('signin')) return false;
        if (current !== inputEl) return false;
        if (gateEmailAdvance(current)) return true; // blocked
        return false; // valid — let VK advance to password
      },
    };

    // Don't let password focus skip an incomplete email/phone
    passwordEl?.addEventListener('focus', (e) => {
      const msg = validateIdentifier(inputEl?.value);
      if (!msg) return;
      e.preventDefault();
      showIdError(msg);
      setTimeout(() => {
        try { inputEl.focus({ preventScroll: true }); } catch (_) {
          try { inputEl.focus(); } catch (__) {}
        }
      }, 0);
    });

    if (inputEl && passwordEl) {
      inputEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (gateEmailAdvance(inputEl)) return;
        passwordEl.focus();
      });
      passwordEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        document.getElementById('signin-submit')?.click();
      });
    }

    // Landed here after the inactivity monitor signed the shopper out.
    try {
      const reason = new URLSearchParams(window.location.search).get('reason');
      if (reason === 'inactive' && err) {
        err.textContent = 'Signed out after 5 minutes of inactivity. Sign in again to continue.';
        err.style.display = 'block';
      }
    } catch (_) { }

    const otpOverlay = document.getElementById('otp-overlay');
    const otpHint = document.getElementById('otp-hint');
    const otpInput = document.getElementById('otp-input');
    const otpVerifyBtn = document.getElementById('otp-verify-btn');
    const otpResendBtn = document.getElementById('otp-resend-btn');
    const otpCancelBtn = document.getElementById('otp-cancel-btn');
    const otpError = document.getElementById('otp-error');
    let pendingOtpPhone = '';
    let pendingOtpPassword = '';

    function openSigninOtp(phone, password, message, email) {
      pendingOtpPhone = phone || '';
      pendingOtpPassword = password || '';
      if (otpHint) {
        otpHint.textContent = message
          || ('Enter the code sent to ' + (email || 'your email') + '.');
      }
      if (otpOverlay) otpOverlay.style.display = 'flex';
      if (otpError) otpError.style.display = 'none';
      if (otpInput) { otpInput.value = ''; otpInput.focus(); }
    }

    if (otpInput && otpVerifyBtn) {
      otpInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        otpVerifyBtn.click();
      });
    }

    async function finishSigninWithSession(session) {
      const { data, error } = await window.sb.auth.setSession({
        access_token: session.access_token,
        refresh_token: session.refresh_token,
      });
      if (error) throw error;

      try {
        const uid = data?.user?.id || session.user?.id;
        const em = data?.user?.email || session.user?.email;
        if (uid) {
          await window.sb.from('profiles').update({ email: em, active: true }).eq('id', uid);
        }
      } catch (_) { }

      const agreed = await window.ncPolicy.requireAccepted(window.sb, data?.user?.id || session.user?.id);
      if (!agreed) {
        try { await window.sb.auth.signOut(); } catch (_) { }
        throw new Error('You must accept the Privacy Policy to use NobleCart.');
      }

      try { await window.sb.rpc('record_profile_login'); } catch (_) { }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin')) {
        window.location.href = 'admin/index.html';
        return;
      }

      const cartId = window.ncCartId ? window.ncCartId() : urlParams.get('cart');
      const uid = data?.user?.id || session.user?.id;
      if (cartId && uid) {
        try { await window.sb.rpc('claim_cart_user', { p_cart_id: cartId, p_user_id: uid }); } catch (_) {}
      }

      try { showLoadingOverlay('', { logo: true }); } catch (_) { }
      const dest = cartId ? 'cabinet.html?cart=' + encodeURIComponent(cartId) : 'cabinet.html';
      setTimeout(() => { window.location.href = dest; }, 4000);
    }

    /* Smart input detection Temporarily Disabled
    // For now, if it looks like a phone (digits/plus), hide password.
    if (inputEl) {
      inputEl.addEventListener('input', () => {
        const val = inputEl.value.trim();
        // Simple heuristic: if it has @ it's email. If it starts with + or is all digits, it's phone.
        const isEmail = val.includes('@');
        if (!isEmail && val.length > 2 && /^[+\d\s\-\(\)]+$/.test(val)) {
          passwordSection.style.display = 'none';
          passwordEl.removeAttribute('required');
        } else {
          passwordSection.style.display = 'block';
          passwordEl.setAttribute('required', 'true');
        }
      });
    }
    */

    function stashSignupEmailPrefill(email) {
      const emailPrefill = String(email || '').trim().toLowerCase();
      if (!emailPrefill || !/@/.test(emailPrefill)) return;
      const payload = JSON.stringify({ email: emailPrefill, at: Date.now() });
      try { sessionStorage.setItem('nc_signup_email', payload); } catch (_) {}
      try { localStorage.setItem('nc_signup_email', payload); } catch (_) {}
    }

    function readFunctionsPayload(signData, signErr) {
      return (async () => {
        let payload = signData;
        if (payload && typeof payload === 'object' && (payload.error || payload.not_found)) {
          return payload;
        }
        if (!signErr) return payload || {};
        const ctx = signErr.context;
        if (!ctx) return payload || { error: signErr.message || 'Request failed' };
        try {
          if (typeof ctx.json === 'function') {
            const j = await ctx.json();
            if (j && typeof j === 'object') return j;
          }
        } catch (_) {}
        try {
          if (typeof ctx.clone === 'function') {
            const j = await ctx.clone().json();
            if (j && typeof j === 'object') return j;
          }
        } catch (_) {}
        try {
          if (typeof ctx.text === 'function') {
            const t = await ctx.text();
            if (t) return JSON.parse(t);
          }
        } catch (_) {}
        return payload || { error: signErr.message || 'Request failed' };
      })();
    }

    let signinInFlight = false;
    async function runSigninSubmit() {
      if (signinInFlight) return;
      err.style.display = 'none';
      const idErr = validateIdentifier(inputEl.value);
      if (idErr) {
        showIdError(idErr);
        try { inputEl.focus({ preventScroll: true }); } catch (_) {
          try { inputEl.focus(); } catch (__) {}
        }
        return;
      }

      const userVal = normalizedIdentifierForSubmit(inputEl.value);

      const password = passwordEl.value.trim();
      if (!password) {
        err.textContent = 'Please enter your password.';
        err.style.display = 'block';
        try {
          document.body.classList.remove('focus-email');
          document.body.classList.add('keyboard-visible', 'focus-password');
        } catch (_) {}
        try { passwordEl.focus({ preventScroll: true }); } catch (_) {
          try { passwordEl.focus(); } catch (__) {}
        }
        return;
      }

      signinInFlight = true;
      setSigninBusy(true);
      try { showLoadingOverlay('Signing you in…'); } catch (_) {}

      try {
        if (!window.sb) throw new Error('Auth not initialized.');

        const { data: signData, error: signErr } = await window.sb.functions.invoke('auth-signin', {
          body: { identifier: userVal, password },
        });

        const payload = await readFunctionsPayload(signData, signErr);

        if (payload && payload.error) {
          if (payload.needs_otp) {
            hideLoadingOverlay();
            setSigninBusy(false);
            signinInFlight = false;
            openSigninOtp(
              payload.phone,
              password,
              payload.error || 'Enter the verification code we sent to your email.',
              payload.email
            );
            return;
          }
          if (payload.wrong_password || /password is wrong/i.test(payload.error || '')) {
            hideLoadingOverlay();
            setSigninBusy(false);
            signinInFlight = false;
            err.textContent = 'That password is wrong.';
            err.style.display = 'block';
            try {
              document.body.classList.remove('focus-email');
              document.body.classList.add('keyboard-visible', 'focus-password');
            } catch (_) {}
            try { passwordEl.focus({ preventScroll: true }); } catch (_) {
              try { passwordEl.focus(); } catch (__) {}
            }
            return;
          }
          if (payload.not_found && /@/.test(userVal)) {
            stashSignupEmailPrefill(payload.email || userVal);
            err.textContent = 'No account found with that email. Tap “Create account” below within 20 seconds to continue with it.';
            err.style.display = 'block';
            hideLoadingOverlay();
            setSigninBusy(false);
            signinInFlight = false;
            return;
          }
          throw new Error(payload.error);
        }
        if (signErr && !(payload && payload.session)) throw signErr;

        const session = payload?.session;
        if (!session?.access_token || !session?.refresh_token) {
          throw new Error('Sign-in failed (no session).');
        }
        // Keep overlay up through session finish + redirect
        await finishSigninWithSession(session);
      } catch (e) {
        hideLoadingOverlay();
        setSigninBusy(false);
        signinInFlight = false;
        const msg = e?.message || '';
        if (/No account found with that email/i.test(msg) && /@/.test(userVal)) {
          stashSignupEmailPrefill(userVal);
          err.textContent = 'No account found with that email. Tap “Create account” below within 20 seconds to continue with it.';
        } else if (/password is wrong/i.test(msg)) {
          err.textContent = 'That password is wrong.';
          try {
            document.body.classList.remove('focus-email');
            document.body.classList.add('keyboard-visible', 'focus-password');
          } catch (_) {}
          try { passwordEl.focus({ preventScroll: true }); } catch (_) {
            try { passwordEl.focus(); } catch (__) {}
          }
        } else if (/invalid login credentials/i.test(msg)) {
          err.textContent = 'That password is wrong.';
          try { passwordEl.focus({ preventScroll: true }); } catch (_) {
            try { passwordEl.focus(); } catch (__) {}
          }
        } else if (/email not confirmed/i.test(msg)) {
          err.textContent = 'Please confirm your email address before signing in.';
        } else {
          err.textContent = msg || 'Sign-in failed.';
        }
        err.style.display = 'block';
      }
    }

    form?.addEventListener('submit', (e) => { e.preventDefault(); runSigninSubmit(); });
    document.getElementById('signin-submit')?.addEventListener('click', () => { runSigninSubmit(); });

    if (otpVerifyBtn) {
      otpVerifyBtn.addEventListener('click', async () => {
        const token = (otpInput?.value || '').trim();
        if (!token || !pendingOtpPhone) return;
        if (otpError) otpError.style.display = 'none';
        otpVerifyBtn.disabled = true;
        try { showLoadingOverlay('Verifying…'); } catch (_) {}
        try {
          const { data, error } = await window.sb.functions.invoke('auth-verify-otp', {
            body: { phone: pendingOtpPhone, code: token, password: pendingOtpPassword },
          });
          let payload = data;
          if ((!payload || payload.error) && error) {
            try {
              if (typeof error.context?.json === 'function') payload = await error.context.json();
            } catch (_) {}
          }
          if (payload?.error) throw new Error(payload.error);
          if (error) throw error;
          if (!payload?.session) throw new Error(payload?.message || 'Verified. Please sign in again.');
          if (otpOverlay) otpOverlay.style.display = 'none';
          await finishSigninWithSession(payload.session);
        } catch (e) {
          hideLoadingOverlay();
          otpVerifyBtn.disabled = false;
          if (otpError) {
            otpError.textContent = e.message || 'Invalid Code';
            otpError.style.display = 'block';
          }
        }
      });
    }
    if (otpResendBtn) {
      otpResendBtn.addEventListener('click', async () => {
        if (!pendingOtpPhone) return;
        if (otpError) otpError.style.display = 'none';
        try {
          const { data, error } = await window.sb.functions.invoke('auth-resend-otp', {
            body: { phone: pendingOtpPhone },
          });
          let payload = data;
          if ((!payload || payload.error) && error) {
            try {
              if (typeof error.context?.json === 'function') payload = await error.context.json();
            } catch (_) {}
          }
          if (payload?.error) throw new Error(payload.error);
          if (error) throw error;
          if (otpError) {
            otpError.style.color = '#166534';
            otpError.textContent = 'Code resent.';
            otpError.style.display = 'block';
          }
        } catch (e) {
          if (otpError) {
            otpError.style.color = '';
            otpError.textContent = e.message || 'Could not resend code.';
            otpError.style.display = 'block';
          }
        }
      });
    }
    if (otpCancelBtn) {
      otpCancelBtn.addEventListener('click', () => {
        if (otpOverlay) otpOverlay.style.display = 'none';
      });
    }
  </script>
  <script>
    // App QR Sign-in: kiosk shows QR encoding cart_id, mobile app scans,
    // app calls qr-cart-approve edge fn, edge fn writes token_hash to DB,
    // Realtime fires here, kiosk calls verifyOtp to sign in automatically.
    (function () {
      // Use the device's persisted cart id, not just the URL, so the App sign-in
      // option survives navigation and reloads.
      const cartId = window.ncCartId ? window.ncCartId() : null;
      const btnTop = document.getElementById('qr-signin-btn-top');

      if (!btnTop) return;
      if (!cartId) { btnTop.style.display = 'none'; return; }

      const form = document.getElementById('signin-form');
      const qrPanel = document.getElementById('qr-app-panel');
      const qrCanvas = document.getElementById('qr-app-canvas');
      const qrMsg = document.getElementById('qr-app-msg');
      const qrDot = document.getElementById('qr-app-dot');

      let channel = null;
      let expireTimer = null;
      let pollInterval = null;
      let qrBusy = false;
      let qrStopped = true;
      let activeSessionId = null;
      let sessionExpiresAt = null;
      let approvalHandled = false;
      const QR_RENEW_MS = 5 * 60 * 1000;

      function setStatus(msg, isError) {
        if (qrMsg) qrMsg.textContent = msg;
        if (qrDot) qrDot.style.background = isError ? '#dc2626' : '#1b7991';
      }

      function cleanup() {
        qrStopped = true;
        qrBusy = false;
        activeSessionId = null;
        sessionExpiresAt = null;
        if (channel) { try { window.sb && window.sb.removeChannel(channel); } catch (_) {} channel = null; }
        if (expireTimer) { clearTimeout(expireTimer); expireTimer = null; }
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      }

      function onQrApproved(tokenHash) {
        if (!tokenHash || approvalHandled || qrStopped) return;
        handleApproved(tokenHash);
      }

      let paneSwapTimer = null;
      let fieldsTimer = null;
      let btnTimer = null;

      function setTopBtnEmailMode(on) {
        if (!btnTop) return;
        btnTop.textContent = on ? 'Sign in with email' : 'Sign in with App';
        btnTop.classList.toggle('is-email-back', !!on);
      }

      function showForm() {
        cleanup();
        approvalHandled = false;
        if (paneSwapTimer) { clearTimeout(paneSwapTimer); paneSwapTimer = null; }
        if (fieldsTimer) { clearTimeout(fieldsTimer); fieldsTimer = null; }
        if (btnTimer) { clearTimeout(btnTimer); btnTimer = null; }

        const qrVisible = qrPanel && qrPanel.style.display === 'block'
          && !qrPanel.classList.contains('is-out');
        if (!qrVisible) {
          setTopBtnEmailMode(false);
          if (btnTop) btnTop.classList.remove('is-hidden-btn');
          if (form) {
            form.style.display = 'block';
            form.classList.remove('is-enter', 'is-await-fields');
          }
          if (qrPanel) {
            qrPanel.style.display = 'none';
            qrPanel.classList.remove('is-out', 'is-ready', 'is-waiting');
          }
          try { window.ncUpdateSigninPill?.(); } catch (_) {}
          return;
        }

        if (btnTop) btnTop.classList.add('is-hidden-btn');
        setTopBtnEmailMode(false);
        btnTimer = setTimeout(function () {
          btnTimer = null;
          if (btnTop) btnTop.classList.remove('is-hidden-btn');
        }, 1400);

        qrPanel.classList.remove('is-ready', 'is-waiting');
        qrPanel.classList.add('is-out');
        if (form) {
          form.classList.remove('is-enter');
          form.classList.add('is-await-fields');
          form.style.display = 'block';
          fieldsTimer = setTimeout(function () {
            fieldsTimer = null;
            form.classList.remove('is-await-fields');
          }, 1300);
        }
        paneSwapTimer = setTimeout(function () {
          paneSwapTimer = null;
          qrPanel.style.display = 'none';
          qrPanel.classList.remove('is-out', 'is-ready', 'is-waiting');
          clearQrFrame();
          try { window.ncUpdateSigninPill?.(); } catch (_) {}
        }, 400);
      }

      async function handleApproved(tokenHash) {
        if (!tokenHash || approvalHandled) return;
        approvalHandled = true;
        cleanup();
        setStatus('Scan detected — signing you in…');
        if (qrDot) qrDot.style.animation = 'none';
        try {
          const { data, error } = await window.sb.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'magiclink',
          });
          if (error) throw error;

          try {
            const uid = data?.user?.id;
            const em = data?.user?.email;
            // Plain update, never upsert: see the note on the password path.
            if (uid) await window.sb.from('profiles').update({ email: em, active: true }).eq('id', uid);
          } catch (_) {}

          // verifyOtp signs in an existing user and creates a brand-new one with
          // the same call, so an app signup lands here without having agreed.
          const agreed = await window.ncPolicy.requireAccepted(window.sb, data?.user?.id);
          if (!agreed) {
            try { await window.sb.auth.signOut(); } catch (_) {}
            setStatus('You must accept the Privacy Policy to continue.', true);
            approvalHandled = false;
            return;
          }

          try { await window.sb.rpc('record_profile_login'); } catch (_) {}

          try {
            const uid = data?.user?.id;
            if (uid) await window.sb.rpc('claim_cart_user', { p_cart_id: cartId, p_user_id: uid });
          } catch (_) {}

          try { showLoadingOverlay('', { logo: true }); } catch (_) {}
          setTimeout(() => { window.location.href = 'index.html?cart=' + encodeURIComponent(cartId); }, 4000);
        } catch (e) {
          approvalHandled = false;
          setStatus('Sign-in failed: ' + (e.message || 'Unknown error'), true);
          if (qrDot) qrDot.style.animation = 'none';
          if (qrPanel && qrPanel.style.display === 'block') {
            try { await startQrSession(); } catch (_) {}
          }
        }
      }

      function revealQrFrame(wrap) {
        if (!wrap || wrap.classList.contains('is-in')) return;
        requestAnimationFrame(function () {
          wrap.classList.add('is-in');
          if (qrCanvas) {
            qrCanvas.classList.add('is-ready');
            qrCanvas.classList.remove('is-waiting');
          }
          if (qrPanel) {
            qrPanel.classList.add('is-ready');
            qrPanel.classList.remove('is-waiting');
          }
        });
      }

      function showQrPlaceholder() {
        if (qrPanel) {
          qrPanel.classList.remove('is-ready');
          qrPanel.classList.add('is-waiting');
        }
        if (!qrCanvas) return;
        qrCanvas.classList.remove('is-ready');
        void qrCanvas.offsetWidth;
        qrCanvas.classList.add('is-waiting');
      }

      function clearQrFrame() {
        if (!qrCanvas) return;
        Array.prototype.forEach.call(qrCanvas.querySelectorAll('.qr-app-frame'), function (el) {
          el.remove();
        });
        qrCanvas.classList.remove('is-waiting', 'is-ready');
      }

      function ensureQrImage() {
        if (!qrCanvas || qrCanvas.querySelector('img')) return;
        const wrap = document.createElement('div');
        wrap.className = 'qr-app-frame';
        const img = document.createElement('img');
        img.alt = 'QR code';
        img.width = 260;
        img.height = 260;
        img.onload = function () { revealQrFrame(wrap); };
        wrap.appendChild(img);
        qrCanvas.appendChild(wrap);
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=520x520&qzone=4&data=' + encodeURIComponent(cartId);
        if (img.complete) revealQrFrame(wrap);
      }

      function startWatching() {
        if (!window.sb) return;
        if (!channel) {
          channel = window.sb.channel('qr-' + cartId)
            .on('broadcast', { event: 'approved' }, (payload) => {
              onQrApproved(payload?.payload?.token_hash);
            })
            .on('postgres_changes', {
              event: 'UPDATE',
              schema: 'public',
              table: 'cart_qr_sessions',
              filter: 'cart_id=eq.' + cartId,
            }, (payload) => {
              const row = payload && payload.new;
              if (row && row.status === 'approved' && row.token_hash) {
                onQrApproved(row.token_hash);
              }
            });
          channel.subscribe();
        }
        if (pollInterval) return;
        pollInterval = setInterval(async () => {
          if (approvalHandled || qrStopped) return;
          if (!activeSessionId) return;
          try {
            if (sessionExpiresAt && Date.now() > new Date(sessionExpiresAt).getTime() + 5000) {
              if (qrPanel && qrPanel.style.display === 'block' && !qrBusy) {
                await startQrSession();
              }
              return;
            }
            let { data } = await window.sb
              .from('cart_qr_sessions')
              .select('status, token_hash')
              .eq('id', activeSessionId)
              .maybeSingle();
            if (!data || data.status !== 'approved' || !data.token_hash) {
              const fallback = await window.sb
                .from('cart_qr_sessions')
                .select('status, token_hash')
                .eq('cart_id', cartId)
                .eq('status', 'approved')
                .not('token_hash', 'is', null)
                .order('created_at', { ascending: false })
                .limit(1)
                .maybeSingle();
              data = fallback.data;
            }
            if (data && data.status === 'approved' && data.token_hash) {
              onQrApproved(data.token_hash);
            }
          } catch (_) {}
        }, 2000);
      }

      function scheduleQrRenew(delayMs) {
        if (expireTimer) { clearTimeout(expireTimer); expireTimer = null; }
        expireTimer = setTimeout(function () {
          startQrSession();
        }, delayMs);
      }

      async function startQrSession() {
        if (!window.sb) { setStatus('Auth not ready', true); return; }
        if (qrBusy || approvalHandled) return;
        if (qrPanel && qrPanel.style.display !== 'block') return;
        qrBusy = true;
        qrStopped = false;
        try {
          if (!qrCanvas || !qrCanvas.querySelector('.qr-app-frame.is-in')) {
            showQrPlaceholder();
          }
          setStatus('Waiting for scan…');
          if (qrDot) qrDot.style.animation = 'qrPulse 1.4s ease-in-out infinite';

          const { data: rows, error: rpcErr } = await window.sb.rpc('start_cart_qr_session', {
            p_cart_id: cartId,
          });
          if (rpcErr) throw rpcErr;
          const row = Array.isArray(rows) ? rows[0] : rows;
          if (!row || !row.id) throw new Error('Could not start QR session');
          activeSessionId = row.id;
          sessionExpiresAt = row.expires_at;

          ensureQrImage();
          startWatching();
          const renewMs = sessionExpiresAt
            ? Math.max(60000, new Date(sessionExpiresAt).getTime() - Date.now() - 30000)
            : QR_RENEW_MS;
          scheduleQrRenew(renewMs);
        } catch (e) {
          setStatus('Error: ' + (e.message || 'Failed to start'), true);
          if (qrDot) qrDot.style.animation = 'none';
          if (!qrStopped && !approvalHandled) scheduleQrRenew(15000);
        } finally {
          qrBusy = false;
        }
      }

      const GUIDE_FADE_OUT_MS = 700; // 200ms delay + 500ms fade
      const LOOP_FADE_OUT_MS = 400;
      const LOOP_HOLD_MS = 200;
      const guideOverlay = document.getElementById('phone-signin-guide');
      const guideDevice = guideOverlay && guideOverlay.querySelector('.phone-guide-device');
      const guideVideo = document.getElementById('phone-signin-guide-video');
      const guideGotIt = document.getElementById('phone-signin-guide-got-it');
      let guideHideTimer = null;
      let guideLoopTimer = null;
      let guideLeaving = false;

      function clearGuideLoopTimer() {
        if (guideLoopTimer) { clearTimeout(guideLoopTimer); guideLoopTimer = null; }
      }

      function hidePhoneGuide() {
        if (!guideOverlay || guideOverlay.hidden || guideLeaving) return;
        guideLeaving = true;
        clearGuideLoopTimer();
        if (guideHideTimer) { clearTimeout(guideHideTimer); guideHideTimer = null; }
        if (guideDevice) {
          guideDevice.classList.remove('is-in', 'is-intro', 'is-loop-out');
          guideDevice.classList.add('is-out');
        }
        guideOverlay.classList.remove('is-open');
        guideOverlay.classList.add('is-leaving');
        startQrSession();
        guideHideTimer = setTimeout(function () {
          guideHideTimer = null;
          try { if (guideVideo) guideVideo.pause(); } catch (_) { }
          if (guideDevice) guideDevice.classList.remove('is-out', 'is-loop-out', 'is-intro');
          guideOverlay.classList.remove('is-leaving', 'is-open');
          guideOverlay.hidden = true;
          guideLeaving = false;
        }, GUIDE_FADE_OUT_MS);
      }

      function replayGuideLoop() {
        if (guideLeaving || !guideVideo || !guideDevice) return;
        if (!guideDevice.classList.contains('is-in')) return;
        guideDevice.classList.remove('is-intro');
        guideDevice.classList.add('is-loop-out');
        clearGuideLoopTimer();
        guideLoopTimer = setTimeout(function () {
          if (guideLeaving) return;
          try { guideVideo.currentTime = 0; } catch (_) { }
          const play = guideVideo.play();
          if (play && typeof play.catch === 'function') play.catch(function () { });
          guideLoopTimer = setTimeout(function () {
            guideLoopTimer = null;
            if (guideLeaving) return;
            guideDevice.classList.remove('is-loop-out');
          }, LOOP_HOLD_MS);
        }, LOOP_FADE_OUT_MS);
      }

      function showPhoneGuide() {
        if (!guideOverlay) return;
        clearGuideLoopTimer();
        if (guideHideTimer) { clearTimeout(guideHideTimer); guideHideTimer = null; }
        guideLeaving = false;
        guideOverlay.classList.remove('is-leaving', 'is-open');
        if (guideDevice) guideDevice.classList.remove('is-in', 'is-out', 'is-intro', 'is-loop-out');
        guideOverlay.hidden = false;
        void guideOverlay.offsetWidth;
        guideOverlay.classList.add('is-open');
        if (guideDevice) guideDevice.classList.add('is-in', 'is-intro');
        if (guideVideo) {
          try { guideVideo.currentTime = 0; } catch (_) { }
          const play = guideVideo.play();
          if (play && typeof play.catch === 'function') play.catch(function () { });
        }
        try { if (guideGotIt) guideGotIt.focus(); } catch (_) { }
      }

      if (guideVideo) {
        guideVideo.addEventListener('ended', replayGuideLoop);
      }

      if (guideGotIt) {
        guideGotIt.addEventListener('click', hidePhoneGuide);
      }

      function showQrPanel() {
        if (paneSwapTimer) { clearTimeout(paneSwapTimer); paneSwapTimer = null; }
        if (fieldsTimer) { clearTimeout(fieldsTimer); fieldsTimer = null; }
        if (btnTimer) { clearTimeout(btnTimer); btnTimer = null; }
        approvalHandled = false;
        if (btnTop) btnTop.classList.remove('is-hidden-btn');
        if (form) {
          form.style.display = 'none';
          form.classList.remove('is-enter', 'is-await-fields');
        }
        if (qrPanel) {
          qrPanel.style.display = 'block';
          qrPanel.classList.remove('is-ready', 'is-waiting', 'is-out');
        }
        clearQrFrame();
        setTopBtnEmailMode(true);
        showPhoneGuide();
        try { window.ncUpdateSigninPill?.(); } catch (_) {}
      }

      function isQrOpen() {
        return qrPanel && qrPanel.style.display === 'block' && !qrPanel.classList.contains('is-out');
      }

      btnTop.addEventListener('click', function () {
        if (isQrOpen()) showForm();
        else showQrPanel();
      });
    })();
  </script>
  <script src="site.js"></script>
  <script>
    // Carry the cart id over to create-account so coming back here still has it.
    // Also pass a short-lived email prefill when "not found" was recent (<20s).
    (function () {
      const link = document.getElementById('create-link');
      if (!link) return;
      ncLinkWithCart(link, 'create-account.html');
      link.addEventListener('click', function () {
        const PREFILL_MS = 20 * 1000;
        let email = '';
        let at = 0;
        try {
          const raw = sessionStorage.getItem('nc_signup_email') || localStorage.getItem('nc_signup_email');
          if (raw) {
            const parsed = JSON.parse(raw);
            email = String(parsed.email || '').trim().toLowerCase();
            at = Number(parsed.at) || 0;
          }
        } catch (_) {}
        const fresh = email && at && (Date.now() - at) <= PREFILL_MS;
        let href = link.getAttribute('href') || 'create-account.html';
        try {
          const u = new URL(href, window.location.href);
          if (fresh) {
            u.searchParams.set('email', email);
            u.searchParams.set('e_at', String(at));
          } else {
            u.searchParams.delete('email');
            u.searchParams.delete('e_at');
            try { sessionStorage.removeItem('nc_signup_email'); } catch (_) {}
            try { localStorage.removeItem('nc_signup_email'); } catch (_) {}
          }
          link.href = u.pathname.split('/').pop() + u.search;
        } catch (_) {}
      });
    })();
  </script>
