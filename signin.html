<body class="signin">
  <div class="container">
    <!-- Fullscreen centered auth layout (no left/right sections) -->
    <div class="auth-wrapper" role="main">
      <div class="auth-card" aria-labelledby="signin-title">
        <h1 id="signin-title" class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to continue</p>

        <!-- Phone sign-in option at top -->
        <div style="text-align: center; margin-bottom: 12px;">
          <button type="button" id="qr-signin-btn-top" class="auth-button shine-button"
            style="background: #1b7991; color: #f2f2f2; font-size: 14px; padding: 12px 16px;">
            Sign in with App
          </button>
        </div>

        <form id="signin-form" class="auth-form" novalidate>
          <div class="auth-field email-field">
            <label class="auth-label" for="email">Email</label>
            <!-- Phone Auth Placeholder Changed: placeholder="you@example.com or +1234567890" -->
            <input id="email" class="auth-input" type="email" name="email" placeholder="you@example.com"
              autocomplete="email" required data-field="email" inputmode="email" />
          </div>

          <div class="auth-field password-field" id="password-section">
            <label class="auth-label" for="password">Password</label>
            <div class="auth-input-wrap">
              <input id="password" class="auth-input" type="password" name="password" placeholder="••••••••"
                autocomplete="current-password" required data-field="password" />
              <button type="button" id="toggle-password" class="password-toggle"
                aria-label="Show password">Show</button>
            </div>
            <script>
              document.getElementById('toggle-password').addEventListener('click', function () {
                const input = document.getElementById('password');
                if (input.type === 'password') {
                  input.type = 'text';
                  this.textContent = 'Hide';
                } else {
                  input.type = 'password';
                  this.textContent = 'Show';
                }
              });
            </script>
          </div>

          <button type="submit" class="auth-button">Sign In</button>
          <div id="auth-error" class="auth-error" style="display:none;"></div>
          <div class="auth-links" aria-label="Helpful links">
            <!-- Password reset is handled in the phone app, not on this kiosk page. -->
            <a href="create-account.html" id="create-link">Create account</a>
          </div>
        </form>

        <!-- App QR Sign-in Panel (shown instead of form when user taps "Sign in with App") -->
        <div id="qr-app-panel" style="display:none; text-align:center; padding:4px 0;">
          <div id="qr-app-canvas" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
          <p style="font-size:13px; color:#555; margin:0 0 10px 0;">Open NobelCart app and scan to sign in</p>
          <div id="qr-app-status" style="font-size:13px; color:#888; display:flex; align-items:center; justify-content:center; gap:8px; min-height:20px;">
            <span id="qr-app-dot" style="width:8px;height:8px;border-radius:50%;background:#1b7991;display:inline-block;animation:qrPulse 1.4s ease-in-out infinite;"></span>
            <span id="qr-app-msg">Waiting for scan…</span>
          </div>
          <div style="margin-top:14px; display:flex; gap:10px; justify-content:center;">
            <button type="button" id="qr-app-refresh" style="padding:9px 18px;border-radius:10px;border:1px solid #000;background:#000;color:#fff;font-size:13px;cursor:pointer;">Refresh QR</button>
            <button type="button" id="qr-app-back" style="padding:9px 18px;border-radius:10px;border:1px solid #ccc;background:none;color:#888;font-size:13px;cursor:pointer;">Use email</button>
          </div>
        </div>
        <style>@keyframes qrPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.8);}}</style>

        <!-- OTP Verification Overlay (Temporarily Disabled)
        <div id="otp-overlay" class="otp-overlay" style="display: none;">
          <div class="otp-card">
            <h2>Verify Phone Number</h2>
            <p>We sent a 6-digit code to your phone.</p>
            <input type="text" id="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" />
            <button id="otp-verify-btn" class="auth-button">Verify Code</button>
            <button id="otp-cancel-btn" class="text-button">Cancel</button>
            <div id="otp-error" class="auth-error" style="display:none;"></div>
          </div>
        </div>
        -->
      </div>
    </div>
  </div>

  <!-- Splash Logic -->
  <script>
    (function () {
      // Skip splash if this is an admin redirect
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin')) return;

      // Check if splash has already been shown in this session
      const hasShown = sessionStorage.getItem('nc_splash_shown');
      if (!hasShown) {
        const splash = document.getElementById('splash-overlay');
        if (splash) {
          splash.style.display = 'flex';
          // Mark as shown immediately so reload/navigation skips it
          sessionStorage.setItem('nc_splash_shown', 'true');

          // Remove splash after animation completes (9s + slight buffer)
          setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => {
              splash.remove();
            }, 1500); // Wait for opacity transition
          }, 9000);
        }
      }
    })();
  </script>

  <script>
    // Clear stale/invalid local session to avoid 400 token errors and prevent watcher loops
    (async () => {
      try {
        if (!window.sb) return;
        // Always force sign-out on the sign-in page to ensure no sticky sessions
        // This prevents the site.js watcher from triggering a "force_sign_out" loop
        await window.sb.auth.signOut({ scope: 'local' });

        // Clear storage but preserve splash screen flag
        const splash = sessionStorage.getItem('nc_splash_shown');
        try { localStorage.removeItem('nc_cart_v1'); } catch { }
        try { sessionStorage.clear(); } catch { }
        if (splash) sessionStorage.setItem('nc_splash_shown', splash);

      } catch { }
    })();
  </script>
  <script>
    // Elevate auth card when focusing inputs and spotlight focused field
    (function () {
      const body = document.body;
      const inputs = Array.from(document.querySelectorAll('.auth-input'));
      if (!inputs.length) return;

      const focusClasses = ['focus-email', 'focus-password'];
      const setFocusState = (field) => {
        body.classList.remove(...focusClasses);
        if (field === 'email' || field === 'password') {
          body.classList.add(`focus-${field}`);
        }
      };

      const handleBlur = () => {
        setTimeout(() => {
          const active = document.activeElement;
          const next = inputs.find((input) => input === active);
          if (next) {
            setFocusState(next.dataset.field);
            body.classList.add('keyboard-visible');
          } else {
            body.classList.remove('keyboard-visible', ...focusClasses);
          }
        }, 140);
      };

      inputs.forEach((input) => {
        input.addEventListener('focus', () => {
          body.classList.add('keyboard-visible');
          setFocusState(input.dataset.field);
        });
        input.addEventListener('blur', handleBlur);
      });

      // If page loads with a field already focused (password manager), adjust immediately
      const active = document.activeElement;
      if (inputs.includes(active)) {
        body.classList.add('keyboard-visible');
        setFocusState(active.dataset.field);
      }
    })();
  </script>
  <script>
    // Minimal full-screen loading overlay (supports centered logo)
    function showLoadingOverlay(message, opts) {
      const options = opts || {};
      try {
        let ov = document.getElementById('nc-loading-overlay');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'nc-loading-overlay';
          ov.setAttribute('aria-live', 'polite');
          ov.style.cssText = 'position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;';
          const inner = document.createElement('div');
          inner.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#fff;';
          if (options.logo) {
            const img = document.createElement('img');
            img.src = 'Images/logo.gif';
            img.alt = 'Loading';
            img.style.cssText = 'max-width:72%;max-height:42vh;height:auto;width:auto;display:block;';
            inner.appendChild(img);
          } else {
            const spinner = document.createElement('div');
            spinner.style.cssText = 'width:32px;height:32px;border:3px solid #444;border-top-color:#fff;border-radius:50%;animation: ncspin 0.9s linear infinite;';
            inner.appendChild(spinner);
          }
          const text = document.createElement('div');
          text.className = 'nc-loading-text';
          text.textContent = message || (options.logo ? '' : 'Loading…');
          if (text.textContent) inner.appendChild(text);
          ov.appendChild(inner);
          const style = document.createElement('style');
          style.textContent = '@keyframes ncspin{to{transform:rotate(360deg)}}';
          document.head.appendChild(style);
          document.body.appendChild(ov);
        } else {
          const t = ov.querySelector('.nc-loading-text');
          if (t) t.textContent = message || 'Loading…';
          // Ensure text is readable on dark bg
          const inner = ov.firstElementChild; if (inner) inner.style.color = '#fff';
          ov.style.display = 'flex';
        }
        return ov;
      } catch (_) { }
    }

    // --- Sign-in Logic (Email OR Phone) ---
    const form = document.getElementById('signin-form');
    const inputEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const passwordSection = document.getElementById('password-section');
    const err = document.getElementById('auth-error');

    // Landed here after the inactivity monitor signed the shopper out.
    try {
      const reason = new URLSearchParams(window.location.search).get('reason');
      if (reason === 'inactive' && err) {
        err.textContent = 'Signed out after 5 minutes of inactivity. Sign in again to continue.';
        err.style.display = 'block';
      }
    } catch (_) { }

    /* OTP Elements Temporarily Disabled
    const otpOverlay = document.getElementById('otp-overlay');
    const otpInput = document.getElementById('otp-input');
    const otpVerifyBtn = document.getElementById('otp-verify-btn');
    const otpCancelBtn = document.getElementById('otp-cancel-btn');
    const otpError = document.getElementById('otp-error');
    let currentPhone = '';
    */

    /* Smart input detection Temporarily Disabled
    // For now, if it looks like a phone (digits/plus), hide password.
    if (inputEl) {
      inputEl.addEventListener('input', () => {
        const val = inputEl.value.trim();
        // Simple heuristic: if it has @ it's email. If it starts with + or is all digits, it's phone.
        const isEmail = val.includes('@');
        if (!isEmail && val.length > 2 && /^[+\d\s\-\(\)]+$/.test(val)) {
          passwordSection.style.display = 'none';
          passwordEl.removeAttribute('required');
        } else {
          passwordSection.style.display = 'block';
          passwordEl.setAttribute('required', 'true');
        }
      });
    }
    */

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      const userVal = inputEl.value.trim();

      if (!userVal) {
        err.textContent = 'Please enter your email.';
        err.style.display = 'block';
        return;
      }

      /* Phone Auth Checks temporarily disabled
      const isEmail = userVal.includes('@');
      const isPhone = !isEmail && /^[+\d\s\-\(\)]+$/.test(userVal);

      if (isPhone) {
        // --- Phone Flow ---
        currentPhone = userVal;
        try {
          if (!window.sb) throw new Error('Auth not initialized.');
          const { error } = await window.sb.auth.signInWithOtp({ phone: currentPhone });
          if (error) throw error;

          // Show OTP UI
          otpOverlay.style.display = 'flex';
          otpInput.focus();
        } catch (ex) {
          err.textContent = ex.message || 'Failed to send SMS code.';
          err.style.display = 'block';
        }
        return; // Stop here, wait for OTP
      }
      */

      // --- Email Flow (Standard) ---
      const password = passwordEl.value.trim();
      if (!password) {
        err.textContent = 'Please enter your password.';
        err.style.display = 'block';
        return;
      }

      try {
        if (!window.sb) throw new Error('Auth not initialized.');
        // Normalize simple admin handle to an email for login
        let email = userVal;
        if (email && !email.includes('@') && email.toLowerCase() === 'admin') {
          email = 'admin@example.com';
        }

        let { data, error } = await window.sb.auth.signInWithPassword({ email, password });

        if (error) {
          throw error;
        }

        // Mark profile active on sign-in. The row itself is created by the
        // on_auth_user_created trigger at signup, so this only refreshes state.
        // is_admin is intentionally not set here: it is granted in SQL only.
        try {
          const uid = data?.user?.id;
          const em = data?.user?.email || email;
          if (uid) {
            // Plain update, never upsert: 0012 revoked table-level UPDATE and did
            // not re-grant it on id, and PostgREST puts every posted column into
            // an upsert's ON CONFLICT DO UPDATE list. Upserting here 403s.
            await window.sb.from('profiles').update({ email: em, active: true }).eq('id', uid);
          }
        } catch (_) { }

        // Accounts created through the app, or from before the policy existed,
        // can reach here without ever having agreed.
        const agreed = await window.ncPolicy.requireAccepted(window.sb, data?.user?.id);
        if (!agreed) {
          try { await window.sb.auth.signOut(); } catch (_) { }
          err.textContent = 'You must accept the Privacy Policy to use NobleCart.';
          err.style.display = 'block';
          return;
        }

        // Count this UI sign-in on profiles.login_count (RPC; clients cannot set the value).
        try { await window.sb.rpc('record_profile_login'); } catch (_) { }

        // On success, show logo overlay for 4 seconds, then go to cabinet
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin')) {
          window.location.href = 'admin/index.html';
          return;
        }

        // Link this cart to the signed-in user
        const cartId = window.ncCartId ? window.ncCartId() : urlParams.get('cart');
        if (cartId && data?.user?.id) {
          try { await window.sb.from('carts').update({ user_id: data.user.id }).eq('cart_id', cartId); } catch (_) {}
        }

        try { showLoadingOverlay('', { logo: true }); } catch (_) { }
        const dest = cartId ? 'cabinet.html?cart=' + encodeURIComponent(cartId) : 'cabinet.html';
        setTimeout(() => { window.location.href = dest; }, 4000);
      } catch (e) {
        const msg = e?.message || '';
        // Supabase returns the same "Invalid login credentials" for an unknown
        // email and a wrong password, on purpose, so the message has to cover both.
        if (/invalid login credentials/i.test(msg)) {
          err.textContent = 'No account found with that email, or the password is incorrect. Tap “Create account” below if you are new.';
        } else if (/email not confirmed/i.test(msg)) {
          err.textContent = 'Please confirm your email address before signing in.';
        } else {
          err.textContent = msg || 'Sign-in failed.';
        }
        err.style.display = 'block';
      }
    });

    /* OTP Verify Button Logic Disabled
    if (otpVerifyBtn) {
      otpVerifyBtn.addEventListener('click', async () => {
        const token = otpInput.value.trim();
        if (!token) return;
        otpError.style.display = 'none';
        try {
          const { data, error } = await window.sb.auth.verifyOtp({
            phone: currentPhone,
            token: token,
            type: 'sms'
          });
          if (error) throw error;

          // Login Success
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('admin')) {
            window.location.href = 'TableUiBackend/admin/index.html';
            return;
          }
          try { showLoadingOverlay('', { logo: true }); } catch (_) { }
          setTimeout(() => { window.location.href = 'cabinet.html'; }, 4000);
        } catch (e) {
          otpError.textContent = e.message || 'Invalid Code';
          otpError.style.display = 'block';
        }
      });
    }
    if (otpCancelBtn) {
      otpCancelBtn.addEventListener('click', () => {
        otpOverlay.style.display = 'none';
      });
    }
    */
  </script>
  <script>
    // App QR Sign-in: kiosk shows QR encoding cart_id, mobile app scans,
    // app calls qr-cart-approve edge fn, edge fn writes token_hash to DB,
    // Realtime fires here, kiosk calls verifyOtp to sign in automatically.
    (function () {
      // Use the device's persisted cart id, not just the URL, so the App sign-in
      // option survives navigation and reloads.
      const cartId = window.ncCartId ? window.ncCartId() : null;
      const btnTop = document.getElementById('qr-signin-btn-top');

      if (!btnTop) return;
      if (!cartId) { btnTop.style.display = 'none'; return; }

      const form = document.getElementById('signin-form');
      const qrPanel = document.getElementById('qr-app-panel');
      const qrCanvas = document.getElementById('qr-app-canvas');
      const qrMsg = document.getElementById('qr-app-msg');
      const qrDot = document.getElementById('qr-app-dot');
      const backBtn = document.getElementById('qr-app-back');
      const refreshBtn = document.getElementById('qr-app-refresh');

      let channel = null;
      let expireTimer = null;
      let pollInterval = null;

      function setStatus(msg, isError) {
        if (qrMsg) qrMsg.textContent = msg;
        if (qrDot) qrDot.style.background = isError ? '#dc2626' : '#1b7991';
      }

      function cleanup() {
        if (channel) { try { window.sb && window.sb.removeChannel(channel); } catch (_) {} channel = null; }
        if (expireTimer) { clearTimeout(expireTimer); expireTimer = null; }
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      }

      function showForm() {
        cleanup();
        if (qrPanel) qrPanel.style.display = 'none';
        if (form) form.style.display = 'block';
      }

      async function handleApproved(tokenHash) {
        cleanup();
        setStatus('Scan detected — signing you in…');
        if (qrDot) qrDot.style.animation = 'none';
        try {
          const { data, error } = await window.sb.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'magiclink',
          });
          if (error) throw error;

          try {
            const uid = data?.user?.id;
            const em = data?.user?.email;
            // Plain update, never upsert: see the note on the password path.
            if (uid) await window.sb.from('profiles').update({ email: em, active: true }).eq('id', uid);
          } catch (_) {}

          // verifyOtp signs in an existing user and creates a brand-new one with
          // the same call, so an app signup lands here without having agreed.
          const agreed = await window.ncPolicy.requireAccepted(window.sb, data?.user?.id);
          if (!agreed) {
            try { await window.sb.auth.signOut(); } catch (_) {}
            setStatus('You must accept the Privacy Policy to continue.', true);
            return;
          }

          try { await window.sb.rpc('record_profile_login'); } catch (_) {}

          try {
            const uid = data?.user?.id;
            if (uid) await window.sb.from('carts').update({ user_id: uid }).eq('cart_id', cartId);
          } catch (_) {}

          try { showLoadingOverlay('', { logo: true }); } catch (_) {}
          setTimeout(() => { window.location.href = 'index.html?cart=' + encodeURIComponent(cartId); }, 4000);
        } catch (e) {
          setStatus('Sign-in failed: ' + (e.message || 'Unknown error'), true);
          if (qrDot) qrDot.style.animation = 'none';
        }
      }

      async function startQrSession() {
        if (!window.sb) { setStatus('Auth not ready', true); return; }

        setStatus('Waiting for scan…');
        if (qrDot) qrDot.style.animation = 'qrPulse 1.4s ease-in-out infinite';

        // Remove any previous refresh button
        const oldRefBtn = qrPanel && qrPanel.querySelector('.qr-refresh-btn');
        if (oldRefBtn) oldRefBtn.remove();

        try {
          const expiresAt = new Date(Date.now() + 5 * 60 * 1000).toISOString();

          const { data: sessionRow, error: insertErr } = await window.sb
            .from('cart_qr_sessions')
            .insert({ cart_id: cartId, status: 'pending', expires_at: expiresAt })
            .select('id')
            .single();

          if (insertErr) throw insertErr;
          const sessionId = sessionRow.id;

          qrCanvas.innerHTML = '';
          const wrap = document.createElement('div');
          wrap.style.cssText = 'background: #f3f3f3; padding:16px; display:inline-block; border-radius:8px;';
          const img = document.createElement('img');
          img.alt = 'QR code';
          img.width = 260;
          img.height = 260;
          img.style.display = 'block';
          img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=520x520&qzone=4&data=' + encodeURIComponent(cartId);
          wrap.appendChild(img);
          qrCanvas.appendChild(wrap);

          channel = window.sb.channel('qr-' + cartId)
            .on('broadcast', { event: 'approved' }, (payload) => {
              const th = payload?.payload?.token_hash;
              if (th) handleApproved(th);
            });
          await channel.subscribe();

          // Polling fallback: every 3 s check DB for ANY approved session for this cart
          // (catches cases where the app updated a different row than the one we created)
          let alreadyHandled = false;
          pollInterval = setInterval(async () => {
            if (alreadyHandled) return;
            try {
              const { data } = await window.sb
                .from('cart_qr_sessions')
                .select('status, token_hash')
                .eq('cart_id', cartId)
                .eq('status', 'approved')
                .not('token_hash', 'is', null)
                .gt('expires_at', new Date().toISOString())
                .order('created_at', { ascending: false })
                .limit(1)
                .maybeSingle();
              if (data && data.token_hash) {
                alreadyHandled = true;
                clearInterval(pollInterval);
                handleApproved(data.token_hash);
              }
            } catch (_) {}
          }, 3000);

          expireTimer = setTimeout(() => {
            cleanup();
            setStatus('QR expired — tap to refresh', true);
            if (qrDot) qrDot.style.animation = 'none';
            if (backBtn) {
              const refBtn = document.createElement('button');
              refBtn.type = 'button';
              refBtn.className = 'qr-refresh-btn';
              refBtn.textContent = 'Refresh QR';
              refBtn.style.cssText = 'margin-top:10px;padding:10px 20px;border-radius:12px;border:1px solid #000;background:#000;color:#fff;font-size:14px;cursor:pointer;display:block;width:100%;';
              refBtn.onclick = startQrSession;
              backBtn.parentNode.insertBefore(refBtn, backBtn);
            }
          }, 5 * 60 * 1000);

        } catch (e) {
          setStatus('Error: ' + (e.message || 'Failed to start'), true);
          if (qrDot) qrDot.style.animation = 'none';
        }
      }

      function showQrPanel() {
        if (form) form.style.display = 'none';
        if (qrPanel) qrPanel.style.display = 'block';
        startQrSession();
      }

      btnTop.addEventListener('click', showQrPanel);
      if (backBtn) backBtn.addEventListener('click', showForm);
      if (refreshBtn) refreshBtn.addEventListener('click', () => { cleanup(); startQrSession(); });
    })();
  </script>
  <script src="site.js"></script>
  <script>
    // Carry the cart id over to create-account so coming back here still has it.
    ncLinkWithCart(document.getElementById('create-link'), 'create-account.html');
  </script>
</body>
