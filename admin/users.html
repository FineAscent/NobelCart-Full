<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Users</title>
  <script src="../phone-gate.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .admin-title {
      font-size: 28px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .session-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .session-grid {
      width: 100%;
      border-collapse: collapse;
      background: #f3f3f3;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .session-grid th,
    .session-grid td {
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    .session-grid th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
    }

    .muted { color: #6b7280; }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #eef2ff;
      color: #3730a3;
    }

    .pill-admin { background: #fef3c7; color: #92400e; }
    .pill-l2 { background: #ffedd5; color: #9a3412; }
    .pill-l3 { background: #fee2e2; color: #991b1b; }
    .pill-off { background: #f3f4f6; color: #6b7280; }

    .btn {
      border: 1px solid #d1d5db;
      background: #f3f3f3;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }

    .btn:hover { background: #f9fafb; }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .search {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 10px;
      min-width: 240px;
    }

    .level-select {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 4px 8px;
      font: inherit;
      background: #f3f3f3;
    }

    .nowrap { white-space: nowrap; }

    .role-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 12px;
    }
  </style>
</head>

<body class="refunds-standalone">
  <style>
    body.refunds-standalone {
      background: #f3f3f3;
      min-height: 100vh;
    }

    .admin-wrap {
      max-width: 1200px;
      width: 100%;
      padding: 24px 16px;
      margin: 0 auto;
    }
  </style>
  <div class="admin-wrap">
    <div class="admin-title">
      <a class="btn" href="index.html"
        style="height:28px; padding:4px 10px; display:inline-flex; align-items:center;">Admin</a>
      <span>Users</span>
    </div>

    <p class="hint" id="level-hint">Admin levels: 1 default · 2 elevated · 3 can grant levels</p>

    <div class="session-toolbar">
      <button id="refresh" class="btn">Refresh</button>
      <input id="search" class="search" type="search" placeholder="Filter by name or email…" />
      <span class="muted" id="status">—</span>
    </div>

    <div style="overflow-x:auto;">
      <table class="session-grid" id="grid">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Signed Up</th>
            <th>Logins</th>
            <th>Last Login</th>
            <th>Status</th>
            <th>Role / Level</th>
            <th>Allergy Warnings</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="8" class="muted">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="admin-access.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);

    let allUsers = [];
    let myLevel = 0;
    let myId = null;

    function rolePill(u) {
      if (!u.is_admin) return '<span class="muted">Customer</span>';
      const level = Number(u.admin_level) || 1;
      const cls = level >= 3 ? 'pill-l3' : level === 2 ? 'pill-l2' : 'pill-admin';
      return `<span class="pill ${cls}">Admin L${level}</span>`;
    }

    async function boot() {
      const access = await window.ncAdminAccess.requireAdminPage('users');
      if (!access) return;
      myId = access.userId;
      myLevel = access.level;
      el('level-hint').textContent = myLevel >= 3
        ? 'You are Admin L3 — you can grant or change admin levels below.'
        : `You are Admin L${myLevel}. Only Admin L3 can change levels.`;
      loadUsers();
    }

    async function loadUsers() {
      const status = el('status');
      status.textContent = 'Loading…';
      try {
        const { data, error } = await window.sb
          .from('profiles')
          .select('id, display_name, email, created_at, active, is_admin, admin_level, show_allergy_caution, login_count, last_login_at')
          .order('created_at', { ascending: false });
        if (error) throw error;
        allUsers = Array.isArray(data) ? data : [];
        render();
        status.textContent = allUsers.length + ' user' + (allUsers.length === 1 ? '' : 's');
      } catch (e) {
        console.error(e);
        el('tbody').innerHTML = '<tr><td colspan="8" class="muted">Error loading users.</td></tr>';
        status.textContent = 'Error: ' + (e.message || e);
      }
    }

    function levelControls(u) {
      if (myLevel < 3) return '';
      const current = u.is_admin ? (Number(u.admin_level) || 1) : 0;
      return `
        <select class="level-select" data-user-id="${esc(u.id)}" aria-label="Set admin level">
          <option value="0" ${current === 0 ? 'selected' : ''}>Customer</option>
          <option value="1" ${current === 1 ? 'selected' : ''}>Admin L1</option>
          <option value="2" ${current === 2 ? 'selected' : ''}>Admin L2</option>
          <option value="3" ${current === 3 ? 'selected' : ''}>Admin L3</option>
        </select>`;
    }

    function render() {
      const q = (el('search').value || '').trim().toLowerCase();
      const rows = q
        ? allUsers.filter(u =>
          (u.email || '').toLowerCase().includes(q) ||
          (u.display_name || '').toLowerCase().includes(q))
        : allUsers;

      const tb = el('tbody');
      if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="8" class="muted">No users found.</td></tr>';
        return;
      }

      tb.innerHTML = rows.map(u => {
        const created = u.created_at ? new Date(u.created_at).toLocaleString() : '—';
        const lastLogin = u.last_login_at ? new Date(u.last_login_at).toLocaleString() : '—';
        const logins = Number.isFinite(Number(u.login_count)) ? Number(u.login_count) : 0;
        const name = u.display_name ? esc(u.display_name) : '<span class="muted">(no name)</span>';
        const active = u.active === false
          ? '<span class="pill pill-off">Inactive</span>'
          : '<span class="pill">Active</span>';
        const allergy = u.show_allergy_caution === false ? 'Off' : 'On';
        return `
          <tr data-user-id="${esc(u.id)}">
            <td>${name}</td>
            <td class="nowrap">${esc(u.email) || '<span class="muted">(no email)</span>'}</td>
            <td class="nowrap muted">${esc(created)}</td>
            <td class="nowrap">${logins}</td>
            <td class="nowrap muted">${esc(lastLogin)}</td>
            <td>${active}</td>
            <td>
              <div class="role-cell">
                ${rolePill(u)}
                ${levelControls(u)}
              </div>
            </td>
            <td class="muted">${allergy}</td>
          </tr>`;
      }).join('');
    }

    async function onLevelChange(select) {
      const userId = select.getAttribute('data-user-id');
      const value = Number(select.value);
      const makeAdmin = value > 0;
      const level = makeAdmin ? value : 1;
      select.disabled = true;
      try {
        const { data, error } = await window.sb.rpc('set_admin_access', {
          target_user_id: userId,
          make_admin: makeAdmin,
          new_level: level,
        });
        if (error) throw error;
        const updated = Array.isArray(data) ? data[0] : data;
        const idx = allUsers.findIndex(u => u.id === userId);
        if (idx >= 0 && updated) {
          allUsers[idx].is_admin = updated.is_admin;
          allUsers[idx].admin_level = updated.admin_level;
        } else {
          await loadUsers();
          return;
        }
        render();
        el('status').textContent = 'Updated admin access';
      } catch (e) {
        alert(e.message || 'Failed to update admin level');
        render();
      } finally {
        select.disabled = false;
      }
    }

    el('refresh').addEventListener('click', loadUsers);
    el('search').addEventListener('input', render);
    el('tbody').addEventListener('change', (e) => {
      const sel = e.target.closest('select.level-select');
      if (sel) onLevelChange(sel);
    });

    boot();
  </script>
</body>

</html>
